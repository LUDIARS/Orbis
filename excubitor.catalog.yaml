# Excubitor catalog fragment -- Orbis owns this desktop application definition.
services:
  - code: orbis-ai-only
    name: Orbis AI-only test browser (Cc control)
    tier: local-app
    project_code: Ob
    component: ai-browser
    repo: LUDIARS/Orbis
    runtime: node
    app_kind: electron
    cwd: ${ARS_ROOT}/Orbis
    command: node node_modules/electron/cli.js .
    build_command: npm run build
    autostart: false
    restart_policy: "no"
    env:
      ORBIS_MODE: ai-only
      # Provision ORBIS_AI_CC_TOKEN through the secret store to this service and Cc.
      # ORBIS_AI_ALLOWED_ORIGINS: exact JSON origins from the target service catalogs.
      # ORBIS_EXCUBITOR_URL/EXCUBITOR_URL: inject the current management endpoint.
      # Missing configuration is a startup error; no human-mode fallback.
    health:
      type: process
      interval_sec: 5
      grace_period_sec: 20
  - code: orbis-native
    name: Orbis Tela CEF native host
    tier: local-app
    project_code: Ob
    runtime: app
    repo: LUDIARS/Orbis
    cwd: ${ARS_ROOT}/Orbis
    exec: ${ARS_ROOT}/Orbis/build-native/Release/orbis_native.exe
    exec_args:
      - '--font=${ARS_ROOT}/Orbis/build-native/assets/default.ttf'
      - '--profile=${ARS_ROOT}/Orbis/build-native/profile'
      - '--url=https://example.com'
    autostart: false
    restart_policy: 'no'
  - code: orbis
    name: Orbis (interest graph browser)
    tier: local-app
    project_code: Ob
    component: app
    repo: LUDIARS/Orbis
    runtime: node
    app_kind: electron
    cwd: ${ARS_ROOT}/Orbis
    command: npm run dev
    allow_hot_reload: true
    autostart: false
    restart_policy: "no"
    health:
      type: process
      interval_sec: 5
      grace_period_sec: 20
