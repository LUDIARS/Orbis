name: Electron patch watch
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electron-patch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create bump branch when a newer stable Electron exists
        shell: bash
        run: |
          set -euo pipefail
          current=$(node -e "const value=require('./package.json').devDependencies.electron; const match=value.match(/^[~^]?(\\d+\\.\\d+\\.\\d+)$/); if (!match) throw new Error('Invalid Electron version range'); console.log(match[1])")
          latest=$(npm view electron version)
          node -e "if (!/^\\d+\\.\\d+\\.\\d+$/.test(process.argv[1])) throw new Error('Registry returned an invalid Electron version')" "$latest"

          if ! node -e "const parse=(value)=>value.split('.').map(Number); const a=parse(process.argv[1]); const b=parse(process.argv[2]); const newer=b.some((part,index)=>part>a[index] && b.slice(0,index).every((value,i)=>value===a[i])); process.exit(newer ? 0 : 1)" "$current" "$latest"; then
            echo "Electron $current is current; no branch needed."
            exit 0
          fi

          branch="chore/electron-$latest"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null; then
            echo "Branch $branch already exists."
            exit 0
          fi

          npm install --package-lock-only --ignore-scripts --save-dev "electron@^$latest"
          git config user.name 'orbis-bot'
          git config user.email 'orbis-bot@users.noreply.github.com'
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "chore(radix): bump electron to $latest"
          git push origin "HEAD:refs/heads/$branch"
